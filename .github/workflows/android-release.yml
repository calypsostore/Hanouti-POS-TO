name: Android APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        id: sdk
        shell: bash
        run: |
          if { [[ -n "${ANDROID_HOME:-}" ]] && [[ -d "$ANDROID_HOME" ]]; } || { [[ -n "${ANDROID_SDK_ROOT:-}" ]] && [[ -d "$ANDROID_SDK_ROOT" ]]; }; then
            if command -v sdkmanager >/dev/null 2>&1; then
              echo "missing=false" >> "$GITHUB_OUTPUT"
            else
              echo "missing=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Android SDK
        if: steps.sdk.outputs.missing == 'true'
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          version="$(node -e 'process.stdout.write(require("./package.json").version)')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must match major.minor.patch."
            exit 1
          fi
          version_code="$(python3 -c 'import sys; major, minor, patch = map(int, sys.argv[1].split(".")); print(major * 10000 + minor * 100 + patch)' "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Validate and decode signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing secret ANDROID_KEY_ALIAS."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing secret ANDROID_KEY_PASSWORD."; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing secret VITE_SUPABASE_URL."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing secret VITE_SUPABASE_ANON_KEY."; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hanouti-release.jks"
          test -s "$RUNNER_TEMP/hanouti-release.jks" || { echo "::error::Decoded keystore is empty."; exit 1; }

      - name: Build web assets
        env:
          VITE_DATA_DRIVER: supabase
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/hanouti-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.app-version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          signed_apk="android/app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -s "$signed_apk" ]]; then
            source_apk="$signed_apk"
          elif [[ -s "$unsigned_apk" ]]; then
            echo "::error::Only an unsigned release APK was produced."
            exit 1
          else
            echo "::error::No release APK was produced."
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          output_dir="$RUNNER_TEMP/hanouti-apk"
          mkdir -p "$output_dir"
          output_apk="$output_dir/7anouti-POS-${short_sha}.apk"
          cp "$source_apk" "$output_apk"
          echo "path=$output_apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=7anouti-POS-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  android-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        id: sdk
        shell: bash
        run: |
          if { [[ -n "${ANDROID_HOME:-}" ]] && [[ -d "$ANDROID_HOME" ]]; } || { [[ -n "${ANDROID_SDK_ROOT:-}" ]] && [[ -d "$ANDROID_SDK_ROOT" ]]; }; then
            if command -v sdkmanager >/dev/null 2>&1; then
              echo "missing=false" >> "$GITHUB_OUTPUT"
            else
              echo "missing=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Android SDK
        if: steps.sdk.outputs.missing == 'true'
        uses: android-actions/setup-android@v3

      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$RELEASE_INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match major.minor.patch (for example 1.0.0)."
            exit 1
          fi
          version_code="$(python3 -c 'import sys; major, minor, patch = map(int, sys.argv[1].split(".")); print(major * 10000 + minor * 100 + patch)' "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        run: npm ci

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Validate and decode signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing secret ANDROID_KEY_ALIAS."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing secret ANDROID_KEY_PASSWORD."; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing secret VITE_SUPABASE_URL."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing secret VITE_SUPABASE_ANON_KEY."; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hanouti-release.jks"
          test -s "$RUNNER_TEMP/hanouti-release.jks" || { echo "::error::Decoded keystore is empty."; exit 1; }

      - name: Build web assets
        env:
          VITE_DATA_DRIVER: supabase
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/hanouti-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare release APK
        id: apk
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          signed_apk="android/app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -s "$signed_apk" ]]; then
            source_apk="$signed_apk"
          elif [[ -s "$unsigned_apk" ]]; then
            echo "::error::Only an unsigned release APK was produced."
            exit 1
          else
            echo "::error::No release APK was produced."
            exit 1
          fi
          output_dir="$RUNNER_TEMP/hanouti-release"
          mkdir -p "$output_dir"
          output_apk="$output_dir/7anouti-POS-v${RELEASE_VERSION}.apk"
          cp "$source_apk" "$output_apk"
          echo "path=$output_apk" >> "$GITHUB_OUTPUT"

      - name: Create update manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          export RELEASE_VERSION RELEASE_VERSION_CODE RELEASE_NOTES
          python3 -c 'import json, os; repo=os.environ["GITHUB_REPOSITORY"]; version=os.environ["RELEASE_VERSION"]; print(json.dumps({"versionCode": int(os.environ["RELEASE_VERSION_CODE"]), "versionName": version, "apkUrl": f"https://github.com/{repo}/releases/download/v{version}/7anouti-POS-v{version}.apk", "notes": os.environ.get("RELEASE_NOTES", "")}))' > version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 7anouti-POS v${{ steps.version.outputs.version }}
          body: ${{ inputs.notes }}
          files: |
            ${{ steps.apk.outputs.path }}
            version.json
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
