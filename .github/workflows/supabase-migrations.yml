name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Validate database pooler secret
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          test -n "$SUPABASE_DB_POOLER_URL" || {
            echo "::error::Set SUPABASE_DB_POOLER_URL to this project's Supabase session-pooler connection string."
            exit 1
          }
          echo "::add-mask::$SUPABASE_DB_POOLER_URL"
          case "$SUPABASE_DB_POOLER_URL" in
            postgresql://*@*.pooler.supabase.com:5432/*|postgres://*@*.pooler.supabase.com:5432/*) ;;
            *)
              echo "::error::SUPABASE_DB_POOLER_URL must use the session pooler on port 5432, not the direct or transaction-pooler connection."
              exit 1
              ;;
          esac

      - name: Apply pending production migrations
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          supabase db push \
            --remote="$SUPABASE_DB_POOLER_URL" \
            --yes
