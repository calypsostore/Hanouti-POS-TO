<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F8F9" />
    <script>
      (() => {
        let theme = 'system';
        try {
          const settings = JSON.parse(localStorage.getItem('hanouti.display-settings.v1') || 'null');
          if (settings?.theme === 'light' || settings?.theme === 'dark' || settings?.theme === 'system') {
            theme = settings.theme;
          }
        } catch {
          theme = 'system';
        }
        const dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', dark ? '#101719' : '#F4F8F9');
      })();
    </script>
    <meta name="description" content="Fast orders. Clear shifts. 7anouti-POS tracks café orders and shifts." />
    <link rel="icon" type="image/png" href="/logo1.png" />
    <link rel="preload" href="/fonts/RobotoMono-Variable-Latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <title>7anouti-POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
