name: Supabase daily backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate backup secrets
        shell: bash
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_POOLER_URL" || { echo "::error::Set SUPABASE_DB_POOLER_URL to this project's Supabase session-pooler connection string."; exit 1; }
          echo "::add-mask::$SUPABASE_DB_POOLER_URL"
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo "::error::Set the BACKUP_ENCRYPTION_KEY Actions secret."; exit 1; }
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          node .github/scripts/validate-supabase-pooler-url.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client gnupg

      - name: Export and encrypt database
        shell: bash
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          dump="$RUNNER_TEMP/hanouti-${GITHUB_RUN_ID}.dump"
          encrypted="$RUNNER_TEMP/hanouti-${GITHUB_RUN_ID}.dump.gpg"
          passphrase_file="$RUNNER_TEMP/backup-passphrase"
          trap 'rm -f "$dump" "$passphrase_file"' EXIT
          printf '%s' "$BACKUP_ENCRYPTION_KEY" > "$passphrase_file"
          chmod 600 "$passphrase_file"
          pg_dump --format=custom --no-owner --no-acl --file="$dump" "$SUPABASE_DB_POOLER_URL"
          test -f "$dump" && test -s "$dump" || { echo "::error::Database dump is missing or empty."; exit 1; }
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --symmetric --cipher-algo AES256 \
            --output "$encrypted" "$dump"
          test -f "$encrypted" && test -s "$encrypted" || { echo "::error::Encrypted backup is missing or empty."; exit 1; }

      - name: Store encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/hanouti-${{ github.run_id }}.dump.gpg
          if-no-files-found: error
          retention-days: 30
