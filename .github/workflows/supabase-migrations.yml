name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-migrations.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Validate database secret
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::Set the SUPABASE_DB_PASSWORD Actions secret."
            exit 1
          }

      - name: Apply pending production migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push \
            --remote=xokqhrmtvfcvvddvdete \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes
