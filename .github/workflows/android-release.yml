name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0)
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version and tag
        id: validate
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match major.minor.patch (for example 1.0.0)."
            exit 1
          fi

          if ! remote_tags="$(git ls-remote --refs --tags origin "refs/tags/v${RELEASE_VERSION}")"; then
            echo "::error::Could not check whether the release tag already exists."
            exit 1
          fi
          if [[ -n "$remote_tags" ]]; then
            echo "::error::Release tag v${RELEASE_VERSION} already exists."
            exit 1
          fi

          version_code="$(python3 -c 'import sys; major, minor, patch = map(int, sys.argv[1].split(".")); print(major * 10000 + minor * 100 + patch)' "$RELEASE_VERSION")"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        id: sdk
        shell: bash
        run: |
          if { [[ -n "${ANDROID_HOME:-}" ]] && [[ -d "$ANDROID_HOME" ]]; } || { [[ -n "${ANDROID_SDK_ROOT:-}" ]] && [[ -d "$ANDROID_SDK_ROOT" ]]; }; then
            if command -v sdkmanager >/dev/null 2>&1; then
              echo "missing=false" >> "$GITHUB_OUTPUT"
            else
              echo "missing=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Android SDK
        if: steps.sdk.outputs.missing == 'true'
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Set release version
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Validate and decode signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing secret ANDROID_KEY_ALIAS."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing secret ANDROID_KEY_PASSWORD."; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing secret VITE_SUPABASE_URL."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing secret VITE_SUPABASE_ANON_KEY."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hanouti-release.jks"
          test -s "$RUNNER_TEMP/hanouti-release.jks" || { echo "::error::Decoded keystore is empty."; exit 1; }

      - name: Build web assets
        env:
          VITE_DATA_DRIVER: supabase
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/hanouti-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ inputs.version }}
          APP_VERSION_CODE: ${{ steps.validate.outputs.version_code }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare release APK
        id: apk
        shell: bash
        run: |
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="android/app/build/outputs/apk/release/app-release.apk"
          if [[ -f "$unsigned_apk" ]]; then
            echo "::error::Gradle produced an unsigned APK."
            exit 1
          fi
          if [[ ! -s "$signed_apk" ]]; then
            echo "::error::Signed release APK was not produced."
            exit 1
          fi
          output_dir="$RUNNER_TEMP/hanouti-release"
          mkdir -p "$output_dir"
          output_apk="$output_dir/7anouti-POS-v${RELEASE_VERSION}.apk"
          cp "$signed_apk" "$output_apk"
          echo "path=$output_apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7anouti-POS-v${{ inputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: 7anouti-POS v${{ inputs.version }}
          body: ${{ inputs.notes }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
