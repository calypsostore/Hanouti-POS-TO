name: VPS SSH Connectivity Test

on:
  push:
    branches:
      - feature/supabase-vps-deployment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test secure VPS SSH connection
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/hanouti_vps
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hanouti_vps ~/.ssh/known_hosts
          ssh -i ~/.ssh/hanouti_vps \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            hanouti-deploy@84.247.176.105 \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          user_name="$(id -un)"
          if [[ "$user_name" != "hanouti-deploy" ]]; then
            echo "SSH session is not running as hanouti-deploy."
            exit 1
          fi
          home_dir="$(getent passwd "$user_name" | cut -d: -f 6)"
          if [[ -z "$home_dir" ]]; then
            echo "Could not determine the SSH user's home directory."
            exit 1
          fi
          printf 'Remote user: %s\nRemote home: %s\n' "$user_name" "$home_dir"
          REMOTE
